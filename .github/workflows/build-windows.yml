name: Build Windows App

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend build
        run: npm run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      # Keep CI unsigned for internal builds. When a real Windows certificate is
      # available, import the PFX before this step and remove --no-sign.
      - name: Build unsigned Tauri MSI
        run: npm run tauri -- build --no-sign

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: ai-cue-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30
          if-no-files-found: error

  release:
    # 仅在推送 v* tag 时触发发布
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-cue-windows-msi
          path: artifacts

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload MSI
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AI Cue ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*.msi
