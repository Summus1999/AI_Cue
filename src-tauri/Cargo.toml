[package]
name = "ai-cue"
version = "1.1.1"
description = "AI Cue - 不被屏幕捕获的面试助手"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ai_cue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

# HTTP client for API calls (bypasses CORS)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
futures-util = "0.3"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
uuid = { version = "1.10", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# 日志系统依赖
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# 文件监听依赖
notify = "6"

# URL 解析
url = "2"

# 正则表达式
regex = "1"
lopdf = "0.35"

# 音频录制依赖
hound = "3.5"
once_cell = "1.19"
sysinfo = "0.33"
windows = { version = "0.61.3", features = ["Data_Pdf", "Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Speech", "Win32_System_Com", "Win32_System_Ole", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# 截图依赖
screenshots = "0.8"
image = "0.25"
tauri-plugin-dialog = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
